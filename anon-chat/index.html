<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Anon Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f1115;color:#eee;font:15px system-ui,-apple-system,Segoe UI,sans-serif;height:100vh}
main{max-width:760px;height:100vh;margin:auto;display:flex;flex-direction:column;padding:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-size:20px;margin:0}
#status{font-size:12px;color:#8f98a8}
#messages{flex:1;overflow:auto;border:1px solid #292e38;border-radius:12px;padding:12px;background:#0a0c10}
.msg{margin:0 0 10px;word-wrap:break-word}
.name{font-weight:700}
.time{font-size:11px;color:#707887;margin-left:6px}
#form{display:flex;gap:8px;margin-top:12px}
input,button{border:1px solid #303642;border-radius:9px;background:#171a21;color:#eee;padding:11px 12px;font:inherit}
input:focus{outline:2px solid #5664ff33;border-color:#6570ff}
#name{width:150px}
#text{flex:1}
button{cursor:pointer;background:#242938}
button:hover{background:#2d3344}
#setup{position:fixed;inset:0;background:#0f1115;display:grid;place-items:center;padding:20px}
.card{width:min(520px,100%);border:1px solid #292e38;background:#151820;border-radius:14px;padding:20px}
.card h2{margin-top:0}
.card p{color:#aab1bf;line-height:1.5}
.row{display:flex;gap:8px;margin-top:12px}
.row input{flex:1}
.small{font-size:12px;color:#858d9b}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="setup">
  <div class="card">
    <h2>Anon Chat</h2>
    <p>Messages are encrypted in your browser before they are sent to Firebase. The encryption key stays in the URL fragment and is never sent to Firebase.</p>
    <div class="row">
      <input id="room" placeholder="Room code or leave blank">
      <button id="newRoom">New room</button>
    </div>
    <div class="row">
      <input id="setupName" maxlength="32" placeholder="Name">
      <button id="join">Join</button>
    </div>
    <p class="small">Share the full room URL with people you trust. Do not remove the part after the #.</p>
    <p class="small" id="setupError"></p>
  </div>
</div>

<main id="app" class="hidden">
<header>
  <h1>Anon Chat</h1>
  <span id="status">Connecting...</span>
</header>
<section id="messages" aria-live="polite"></section>
<form id="form">
  <input id="name" maxlength="32" autocomplete="off" aria-label="Name">
  <input id="text" maxlength="2000" autocomplete="off" placeholder="Message..." aria-label="Message">
  <button>Send</button>
</form>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, query, orderBy, limitToLast, onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

/*
  Replace this with your Firebase Web App config.
  Firebase Console > Project settings > Your apps > Web app
*/
const firebaseConfig = {
  apiKey: "AIzaSyCMR-AvspjTIcLeWiW9ZkkMQWlb5T1val4",
  authDomain: "anon-chat-f673c.firebaseapp.com",
  projectId: "anon-chat-f673c",
  storageBucket: "anon-chat-f673c.firebasestorage.app",
  messagingSenderId: "369679361254",
  appId: "1:369679361254:web:170d614bd50b4fe0010727"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const enc = new TextEncoder();
const dec = new TextDecoder();

let roomId = null;
let roomKey = null;
let unsubscribe = null;

function bytesToB64(bytes) {
  let s = "";
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s).replaceAll("+","-").replaceAll("/","_").replaceAll("=","");
}
function b64ToBytes(s) {
  s = s.replaceAll("-","+").replaceAll("_","/");
  while (s.length % 4) s += "=";
  const raw = atob(s);
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}
async function makeKey() {
  return crypto.subtle.generateKey({name:"AES-GCM",length:256}, true, ["encrypt","decrypt"]);
}
async function exportKey(key) {
  return bytesToB64(new Uint8Array(await crypto.subtle.exportKey("raw", key)));
}
async function importKey(s) {
  return crypto.subtle.importKey("raw", b64ToBytes(s), {name:"AES-GCM"}, false, ["encrypt","decrypt"]);
}
async function encrypt(value) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = enc.encode(JSON.stringify(value));
  const cipher = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv}, roomKey, data));
  return {iv:bytesToB64(iv), data:bytesToB64(cipher)};
}
async function decrypt(packet) {
  const plain = await crypto.subtle.decrypt(
    {name:"AES-GCM",iv:b64ToBytes(packet.iv)},
    roomKey,
    b64ToBytes(packet.data)
  );
  return JSON.parse(dec.decode(plain));
}
function randomRoomId() {
  const bytes = crypto.getRandomValues(new Uint8Array(12));
  return bytesToB64(bytes);
}
function showError(e) {
  console.error(e);
  $("setupError").textContent = "Could not connect. Check your Firebase config and Firestore rules.";
}

$("newRoom").onclick = () => {
  $("room").value = randomRoomId();
};

async function start() {
  try {
    const hash = location.hash.slice(1);
    if (hash) {
      const [id, key] = hash.split(".");
      if (!id || !key) throw new Error("Invalid room link");
      roomId = id;
      roomKey = await importKey(key);
      $("room").value = roomId;
    } else {
      roomId = $("room").value.trim() || randomRoomId();
      roomKey = await makeKey();
      const keyText = await exportKey(roomKey);
      history.replaceState(null, "", location.pathname + "#" + roomId + "." + keyText);
      $("room").value = roomId;
    }

    const name = $("setupName").value.trim();
    if (!name) throw new Error("Enter a name");

    await signInAnonymously(auth);

    $("name").value = name;
    $("setup").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("status").textContent = "Connected";

    const ref = collection(db, "rooms", roomId, "messages");
    const q = query(ref, orderBy("createdAt", "asc"), limitToLast(100));

    unsubscribe = onSnapshot(q, async snap => {
      const out = [];
      for (const doc of snap.docs) {
        try {
          const value = await decrypt(doc.data().ciphertext);
          out.push({...value, id: doc.id});
        } catch {
          /* Ignore messages that cannot be decrypted with this room key. */
        }
      }
      out.sort((a,b) => a.time - b.time);
      $("messages").replaceChildren(...out.map(renderMessage));
      $("messages").scrollTop = $("messages").scrollHeight;
    }, showError);
  } catch (e) {
    showError(e);
  }
}

function renderMessage(m) {
  const el = document.createElement("div");
  el.className = "msg";

  const name = document.createElement("span");
  name.className = "name";
  name.textContent = m.name;

  const time = document.createElement("span");
  time.className = "time";
  time.textContent = new Date(m.time).toLocaleTimeString();

  const text = document.createElement("div");
  text.textContent = m.text;

  el.append(name, time, text);
  return el;
}

$("join").onclick = start;
$("setupName").addEventListener("keydown", e => {
  if (e.key === "Enter") start();
});
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const text = $("text").value.trim();
  const name = $("name").value.trim();
  if (!text || !name || !auth.currentUser) return;

  $("text").value = "";
  const ciphertext = await encrypt({name, text, time: Date.now()});

  await addDoc(collection(db, "rooms", roomId, "messages"), {
    ciphertext,
    createdAt: serverTimestamp()
  });
});
</script>
</body>
</html>
